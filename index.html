<!doctype html>
<html lang="es">

<head>
  <!-- Lang detection before React loads (SEO + Accessibility) -->
  <script>
    (function () {
      const storedLang = localStorage.getItem('troly_lang');
      if (storedLang) {
        document.documentElement.lang = storedLang;
      } else {
        const browserLang = (navigator.language || navigator.userLanguage).split('-')[0].toLowerCase();
        document.documentElement.lang = browserLang === 'pt' ? 'pt' : browserLang === 'en' ? 'en' : 'es';
      }
    })();
  </script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HV4L0B9J68"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-S120P7605X');
  </script>

  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Troly — La comunidad de coleccionistas más grande de América. Únete por invitación." />
  <title>Troly — Comunidad de Coleccionistas</title>

  <!-- Inter font -->

</head>

</body>

</html>
